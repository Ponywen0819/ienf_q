# IENF Quantification Pipeline Configuration
# This file contains configuration for currently implemented pipeline stages

# =============================================================================
# Stage 01: Connected Components Analysis
# =============================================================================
connected_components:
  # Connectivity type for component detection
  connectivity: 4 # 4 or 8

  # Minimum component area filter (pixels)
  min_area: 0

# =============================================================================
# Stage 02: Seed Extraction
# =============================================================================
seed_extraction:
  # Base segmentation length for uniform seed placement (pixels)
  base_segment_length: 5

# =============================================================================
# Stage 03: Component Pairing Analysis
# =============================================================================
component_pairing:
  # Maximum distance threshold (pixels) - component pairs beyond this distance are skipped
  max_distance_threshold: 50

  # Maximum path cost threshold - connections exceeding this cost are rejected
  max_cost_threshold: 180
