# IENF Quantification Pipeline Configuration - Fast Profile
#
# This profile prioritizes processing speed over precision.
# Use this for quick prototyping, testing, and initial exploration.

# =============================================================================
# Stage 02: Seed Extraction - Fast
# =============================================================================
seed_extraction:
  # Smaller window for faster processing
  window_size: 3

  # Longer segments to reduce number of seeds
  base_segment_length: 15.0
  max_segment_length: 25.0

  # Less sensitive curvature detection
  curvature_threshold: 35.0

  # Smaller skip range
  skip_branchpoint_range: 3

  min_path_points: 10

# =============================================================================
# Stage 03: Network Building - Fast
# =============================================================================
network_building:
  network:
    # Fewer neighbors for faster density estimation
    k_neighbors: 8

    # Lower threshold to reduce graph complexity
    max_edge_cost: 120.0

    verbose: false

  cost_weights:
    # Higher geometric weight for simpler, straighter paths
    alpha: 0.1

    # Reduced image weight for faster pathfinding
    beta: 0.85

    # Minimal curvature penalty
    gamma: 0.05

  density:
    # Simpler density-based pairing with wider ranges
    dense_threshold: 35
    moderate_threshold: 80
    dense_radius: 35
    moderate_radius: 55
    sparse_radius: 85

  pathfinding:
    # Shorter search distances for faster pathfinding
    max_distance_multiplier: 150

    # Larger cutoff for earlier termination
    distance_from_start_cutoff: 35

# =============================================================================
# Stage 04: Neural Reconstruction - Fast
# =============================================================================
reconstruction:
  # More permissive threshold
  max_edge_cost: 140

  # Relaxed validation
  min_branch_angle: 25
  min_quality_threshold: 75

  verbose: false

# =============================================================================
# Pipeline Configuration
# =============================================================================
pipeline:
  paths:
    data_dir: "data"
    output_dir: "output"

  stages:
    run_seed_extraction: true
    run_network_building: true
    run_reconstruction: true

  intermediates:
    # Don't save intermediates for fast processing
    save: false

  logging:
    level: "INFO"
    log_to_file: true
    log_file: "output/pipeline_fast.log"
